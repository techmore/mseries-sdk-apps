[package]
name = "mseries-greeter"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Clean login screen for greetd: greetd protocol client, State/Msg/update state machine and a GTK4 front end; first SDK shell surface"

[lib]
name = "mseries_greeter"

[[bin]]
name = "mseries-greeter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
msdk = { path = "../msdk" }
