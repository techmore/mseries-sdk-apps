[package]
name = "mseries-signal-import"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "One-time import of Signal Desktop history into the Signal Pantheon client's encrypted store"

# Deliberately NOT a member of the ../ workspace: SQLCipher and the plain
# bundled SQLite used by the other crates both claim the `sqlite3` native
# library, and Cargo allows only one such crate per dependency graph.
[workspace]

[dependencies]
openssl = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "backup"] }
serde_json = "1"

# The progress window is optional so the command-line tool and its CI stay
# free of GTK: `cargo build --release --features gui`.
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"], optional = true }

[features]
gui = ["dep:gtk"]

[[bin]]
name = "mseries-signal-import"
path = "src/main.rs"

[[bin]]
name = "mseries-signal-import-gui"
path = "src/gui.rs"
required-features = ["gui"]
