[workspace]
members = ["mseries-power", "granite-smoke", "mseries-update-core", "mseries-updates", "mseries-diskspace", "mseries-pantheon-kit", "mseries-image-studio", "mseries-ai", "mseries-reply", "mseries-messages", "mseries-system-monitor", "claude-pantheon-rs", "msdk", "mseries-broker", "msdk-gtk", "mseries-dock", "mseries-greeter", "mseries-apple-dev", "torrential", "mseries-signal-history"]
resolver = "2"

# Smaller, faster binaries for the session components (the compositor runs on
# every frame). Thin LTO keeps link time reasonable; one codegen unit lets
# LLVM optimise across the whole crate. No `target-cpu`: the same package
# must run on every M-series machine.
[profile.release]
lto = "thin"
codegen-units = 1

# Dev loop: keep file:line in backtraces but drop full variable debuginfo, which is most of the
# linker input and of target/ (debug binary 169 MB -> 36 MB, target dir 2.1 GB -> 1.0 GB for
# mseries-messages). Dependencies carry no debuginfo at all. Release is untouched (above).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
