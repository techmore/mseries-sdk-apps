[package]
name = "claude-pantheon-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Claude for elementary OS: a native Pantheon client of the T3 Code server (Claude Code, Codex, OpenCode, Grok) with offline Claude Code transcripts"

[dependencies]
msdk = { path = "../msdk" }
msdk-gtk = { path = "../msdk-gtk" }
# Same GTK/Granite pins as mseries-diskspace (see mseries/RUST-UPSTREAM-MAINTENANCE.md).
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
granite = { package = "granite-rs", version = "3.3", features = ["v7_8", "gtk_v4_20"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
sourceview5 = "0.11"
vte4 = "0.10"
webkit6 = "0.6"

[[test]]
name = "render"
harness = false
