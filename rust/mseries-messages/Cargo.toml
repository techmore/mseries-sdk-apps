[package]
name = "mseries-messages"
default-run = "mseries-messages"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Native Pantheon Messages client for BlueFerry"

[dependencies]
mseries-pantheon-kit = { path = "../mseries-pantheon-kit" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
granite = { package = "granite-rs", version = "3.3", features = ["v7_8", "gtk_v4_20"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ipnet = "2.12"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
url = "2.5"
percent-encoding = "2"
