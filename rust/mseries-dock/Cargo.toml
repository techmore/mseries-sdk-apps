[package]
name = "mseries-dock"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Dock for the M-series desktop: app resolver, pins and window grouping as SDK logic, shown by the msdk renderer"

[lib]
name = "mseries_dock"

[[bin]]
name = "mseries-dock"
path = "src/main.rs"

[dependencies]
msdk = { path = "../msdk" }
msdk-gtk = { path = "../msdk-gtk" }
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
