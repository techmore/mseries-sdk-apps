name: Signal Pantheon client

on:
  push:
    branches: [dev, main]
    paths:
      - "mseries/signal-pantheon/**"
      - ".github/workflows/signal-pantheon.yml"
  pull_request:
    paths:
      - "mseries/signal-pantheon/**"
      - ".github/workflows/signal-pantheon.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Signal Pantheon build and tests (arm64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/fast-apt

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config valac \
            libgtk-4-dev libgranite-7-dev libjson-glib-dev libsqlite3-dev \
            libsecret-1-dev libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            desktop-file-utils xvfb xauth dbus python3 python3-gi gir1.2-secret-1 \
            gir1.2-glib-2.0 gnome-keyring gstreamer1.0-plugins-base

      - name: Build
        working-directory: mseries/signal-pantheon
        run: |
          meson setup build
          meson compile -C build

      - name: Unit, store, backend and isolated UI tests
        working-directory: mseries/signal-pantheon
        run: meson test -C build --print-errorlogs

      - name: Validate desktop metadata
        run: desktop-file-validate mseries/signal-pantheon/data/io.github.sdolbec.SignalPantheonClient.desktop
