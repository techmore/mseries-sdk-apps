[package]
name = "msdk-homestorage"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"
publish = false

[workspace]

[lib]
name = "app_model"

[dependencies]
msdk = { path = "/work/sdk/msdk" }
msdk-gtk = { path = "/work/sdk/msdk-gtk" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
