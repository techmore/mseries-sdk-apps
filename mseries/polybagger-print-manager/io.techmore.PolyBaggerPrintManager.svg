<?xml version="1.0" encoding="UTF-8"?>
<!-- PolyBagger Print Manager app icon, elementary OS style: a tan industrial label printer
     feeding out a barcode label, with a green ready light. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2c2"/>
      <stop offset="0.55" stop-color="#e2c48f"/>
      <stop offset="1" stop-color="#c79a55"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1dc"/>
      <stop offset="1" stop-color="#e8cf9f"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2b2116" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="shadow" cx="64" cy="118" r="50" gradientTransform="matrix(1 0 0 0.12 0 103.8)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="64" cy="118" rx="50" ry="6" fill="url(#shadow)"/>

  <!-- printer body: tall industrial box -->
  <rect x="14.5" y="14.5" width="99" height="84" rx="8" fill="url(#shell)" stroke="#6b4a1a" stroke-opacity="0.65"/>
  <rect x="15.5" y="15.5" width="97" height="82" rx="7" fill="none" stroke="url(#hl)"/>

  <!-- media door with a dark window onto the label roll -->
  <rect x="22.5" y="22.5" width="58" height="48" rx="4" fill="url(#lid)" stroke="#6b4a1a" stroke-opacity="0.45"/>
  <rect x="28.5" y="28.5" width="46" height="30" rx="3" fill="url(#window)"/>
  <circle cx="51.5" cy="43.5" r="11" fill="#f6ead2" fill-opacity="0.9"/>
  <circle cx="51.5" cy="43.5" r="4.5" fill="#8a6a3c"/>
  <path d="M30 31 h43" stroke="#fff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <rect x="44" y="62" width="16" height="4" rx="2" fill="#6b4a1a" fill-opacity="0.5"/>

  <!-- control panel: ready light and keys -->
  <rect x="86.5" y="22.5" width="20" height="48" rx="4" fill="#3a2e20" stroke="#000" stroke-opacity="0.4"/>
  <circle cx="96.5" cy="32.5" r="5" fill="#68b723" stroke="#206b00" stroke-opacity="0.7"/>
  <circle cx="95.2" cy="31" r="1.6" fill="#fff" fill-opacity="0.6"/>
  <rect x="90" y="43" width="13" height="5" rx="2.5" fill="#d9c49c"/>
  <rect x="90" y="52" width="13" height="5" rx="2.5" fill="#d9c49c"/>
  <rect x="90" y="61" width="13" height="5" rx="2.5" fill="#d9c49c"/>

  <!-- print slot -->
  <rect x="22.5" y="78.5" width="83" height="8" rx="4" fill="#2b2116" stroke="#000" stroke-opacity="0.5"/>

  <!-- label feeding out of the slot -->
  <path d="M30.5 82.5 h67 v28 a3 3 0 0 1 -3 3 h-61 a3 3 0 0 1 -3 -3 z" fill="url(#label)" stroke="#000" stroke-opacity="0.3"/>
  <g fill="#1a1a1a">
    <rect x="37" y="90" width="2.5" height="14"/><rect x="41" y="90" width="1.2" height="14"/>
    <rect x="44" y="90" width="3" height="14"/><rect x="48.5" y="90" width="1.2" height="14"/>
    <rect x="51.5" y="90" width="2.5" height="14"/><rect x="55.5" y="90" width="1.2" height="14"/>
    <rect x="58.5" y="90" width="3" height="14"/><rect x="63" y="90" width="1.2" height="14"/>
    <rect x="66" y="90" width="2.5" height="14"/><rect x="70" y="90" width="1.2" height="14"/>
    <rect x="73" y="90" width="3" height="14"/><rect x="77.5" y="90" width="1.2" height="14"/>
    <rect x="80.5" y="90" width="2.5" height="14"/><rect x="84.5" y="90" width="1.2" height="14"/>
    <rect x="87.5" y="90" width="3" height="14"/>
  </g>
  <rect x="37" y="106.5" width="40" height="2.5" rx="1.25" fill="#1a1a1a" fill-opacity="0.4"/>
</svg>
