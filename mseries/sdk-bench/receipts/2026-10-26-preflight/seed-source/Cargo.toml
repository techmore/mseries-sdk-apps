[package]
name = "msdk-bench-dependency-seed"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
msdk = { path = "/work/sdk/msdk" }
msdk-gtk = { path = "/work/sdk/msdk-gtk" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "=0.32.1"
